<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb"/>
      <stop offset="100%" style="stop-color:#f5576c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="800" height="200" fill="url(#bg)" rx="18"/>

  <!-- decorative stars -->
  <circle cx="50" cy="30" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="120" cy="15" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="200" cy="45" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="680" cy="20" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="740" cy="50" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="770" cy="25" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="600" cy="170" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="650" cy="185" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="100" cy="170" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="30" cy="155" r="1.5" fill="#fff" opacity="0.4"/>

  <!-- glowing orbs -->
  <circle cx="100" cy="100" r="60" fill="#667eea" opacity="0.06" filter="url(#softglow)"/>
  <circle cx="700" cy="100" r="50" fill="#f093fb" opacity="0.06" filter="url(#softglow)"/>

  <!-- book icon group -->
  <g transform="translate(60, 55)" filter="url(#glow)">
    <!-- book body -->
    <rect x="0" y="0" width="70" height="90" rx="6" fill="#667eea" opacity="0.9"/>
    <rect x="4" y="4" width="62" height="82" rx="4" fill="#1a1a2e"/>
    <!-- spine -->
    <rect x="0" y="0" width="12" height="90" rx="6" fill="url(#purple)"/>
    <!-- lines -->
    <rect x="18" y="18" width="38" height="3" rx="1.5" fill="#667eea" opacity="0.7"/>
    <rect x="18" y="28" width="30" height="3" rx="1.5" fill="#667eea" opacity="0.5"/>
    <rect x="18" y="38" width="34" height="3" rx="1.5" fill="#667eea" opacity="0.5"/>
    <rect x="18" y="48" width="26" height="3" rx="1.5" fill="#667eea" opacity="0.4"/>
    <rect x="18" y="58" width="32" height="3" rx="1.5" fill="#667eea" opacity="0.4"/>
    <!-- radar dot -->
    <circle cx="55" cy="72" r="8" fill="none" stroke="#f093fb" stroke-width="1.5" opacity="0.6"/>
    <circle cx="55" cy="72" r="4" fill="none" stroke="#f093fb" stroke-width="1.5" opacity="0.8"/>
    <circle cx="55" cy="72" r="2" fill="#f093fb"/>
  </g>

  <!-- title -->
  <text x="165" y="105" font-family="'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="800" fill="url(#purple)" filter="url(#glow)" letter-spacing="-2">paper-tracker</text>

  <!-- subtitle -->
  <text x="167" y="138" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#a0aec0" letter-spacing="2">git-native autonomous research agent</text>

  <!-- bottom accent line -->
  <rect x="167" y="152" width="200" height="2" rx="1" fill="url(#purple)" opacity="0.6"/>
  <rect x="375" y="152" width="80" height="2" rx="1" fill="url(#pink)" opacity="0.4"/>

  <!-- version badge -->
  <rect x="167" y="165" width="72" height="20" rx="10" fill="#667eea" opacity="0.2"/>
  <text x="203" y="179" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#667eea" font-weight="600">v2.0.0</text>

  <rect x="248" y="165" width="80" height="20" rx="10" fill="#f093fb" opacity="0.15"/>
  <text x="288" y="179" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#f093fb" font-weight="600">9 skills</text>

  <rect x="337" y="165" width="100" height="20" rx="10" fill="#68d391" opacity="0.15"/>
  <text x="387" y="179" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#68d391" font-weight="600">MIT license</text>
</svg>
