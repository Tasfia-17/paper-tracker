<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200">
  <defs>
    <filter id="s">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="daily" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="weekly" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48bb78"/>
      <stop offset="100%" style="stop-color:#38a169"/>
    </linearGradient>
  </defs>

  <rect width="700" height="200" rx="16" fill="#f8f4ff"/>

  <!-- daily card -->
  <rect x="20" y="20" width="310" height="160" rx="14" fill="url(#daily)" filter="url(#s)"/>
  <text x="175" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#fff">Daily  --  8:00 am</text>
  <text x="175" y="76" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#e9d8fd">cron: 0 8 * * *</text>
  <rect x="50" y="88" width="220" height="1" fill="#fff" opacity="0.2"/>
  <text x="175" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#e9d8fd">arxiv-browse + rival-tracker</text>
  <text x="175" y="126" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#e9d8fd">paper-digest + connection-finder</text>
  <text x="175" y="144" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#e9d8fd">citation-alert + knowledge-update</text>
  <text x="175" y="166" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#c4b5fd">git commit after every run</text>

  <!-- weekly card -->
  <rect x="370" y="20" width="310" height="160" rx="14" fill="url(#weekly)" filter="url(#s)"/>
  <text x="525" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="800" fill="#fff">Weekly  --  Monday 9am</text>
  <text x="525" y="76" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#c6f6d5">cron: 0 9 * * 1</text>
  <rect x="400" y="88" width="220" height="1" fill="#fff" opacity="0.2"/>
  <text x="525" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#c6f6d5">trend-radar analysis</text>
  <text x="525" y="126" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#c6f6d5">weekly-report generation</text>
  <text x="525" y="144" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#c6f6d5">reading-queue velocity stats</text>
  <text x="525" y="166" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#9ae6b4">saved to reports/YYYY-MM-DD.md</text>
</svg>
