<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="g">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#bg)"/>
  <!-- book -->
  <rect x="22" y="18" width="56" height="72" rx="5" fill="#667eea" opacity="0.9"/>
  <rect x="26" y="22" width="48" height="64" rx="3" fill="#1a1a2e"/>
  <rect x="22" y="18" width="10" height="72" rx="5" fill="url(#p)"/>
  <rect x="36" y="32" width="28" height="2.5" rx="1.2" fill="#667eea" opacity="0.7"/>
  <rect x="36" y="40" width="22" height="2.5" rx="1.2" fill="#667eea" opacity="0.5"/>
  <rect x="36" y="48" width="26" height="2.5" rx="1.2" fill="#667eea" opacity="0.5"/>
  <rect x="36" y="56" width="18" height="2.5" rx="1.2" fill="#667eea" opacity="0.4"/>
  <!-- radar -->
  <circle cx="88" cy="82" r="18" fill="none" stroke="#f093fb" stroke-width="1.5" opacity="0.3" filter="url(#g)"/>
  <circle cx="88" cy="82" r="12" fill="none" stroke="#f093fb" stroke-width="1.5" opacity="0.5"/>
  <circle cx="88" cy="82" r="6" fill="none" stroke="#f093fb" stroke-width="2" opacity="0.8"/>
  <circle cx="88" cy="82" r="3" fill="#f093fb" filter="url(#g)"/>
  <!-- pulse line -->
  <line x1="88" y1="64" x2="88" y2="70" stroke="#f093fb" stroke-width="1.5" opacity="0.5"/>
  <line x1="70" y1="82" x2="76" y2="82" stroke="#f093fb" stroke-width="1.5" opacity="0.5"/>
</svg>
