spec_version: "0.1.0"
name: paper-tracker
version: 2.0.0
description: "Autonomous research agent that browses arXiv daily, tracks citations, monitors rivals, detects field trends, and keeps your knowledge base permanently current."
author: "GitAgent Hackathon"
license: MIT

model:
  preferred: "claude-sonnet-4-5-20250929"
  fallback:
    - "gpt-4o"
  constraints:
    temperature: 0.2
    max_tokens: 8192

skills:
  - arxiv-browse
  - paper-digest
  - knowledge-update
  - weekly-report
  - citation-alert
  - trend-radar
  - reading-queue
  - rival-tracker
  - connection-finder
  - wiki-build

tools:
  - fetch-page
  - download-pdf

runtime:
  max_turns: 120
  timeout: 900

tags:
  - research
  - arxiv
  - literature-review
  - academia
  - citation-tracking
  - trend-analysis
